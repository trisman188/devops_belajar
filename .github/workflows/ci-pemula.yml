name: Jalur Otomatisasi CI dan CD DevOps

on:
  push:
    branches: [ main ]

jobs:
  # TAHAP CI: Menguji kode program di cloud
  tes_aplikasi:
    runs-on: ubuntu-latest
    steps:
    - name: Ambil Kode Proyek
      uses: actions/checkout@v4

    - name: Beri Izin Eksekusi Script
      run: chmod +x cek_server.sh

    - name: Jalankan Uji Coba Script RAM
      run: ./cek_server.sh

  # TAHAP CD: Membuat Docker Image & Mengirim ke Docker Hub Otomatis
  bangun_dan_kirim_docker:
    runs-on: ubuntu-latest
    # Tugas CD ini HANYA akan berjalan jika tugas pengujian (CI) di atas lolos/sukses!
    needs: tes_aplikasi
    
    steps:
    - name: Ambil Kode Proyek
      uses: actions/checkout@v4

    # Robot melakukan login otomatis ke Docker Hub menggunakan kunci rahasia dari GitHub Secrets
    - name: Login ke Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Robot membangun Docker Image dan langsung mengunggahnya ke akun Anda
    - name: Bangun & Push Docker Image ke Cloud
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: trisman188/ram-monitor:latest
